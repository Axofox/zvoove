name: Observe and check

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: Observation runs per user
        default: '10'

jobs:
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        user: [problem_user]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Observe TC-001
        run: npm run observe -- --user ${{ matrix.user }} --runs ${{ github.event.inputs.runs || 10 }} --out evidence/observations/${{ matrix.user }}
      - name: Check observations against the standards
        run: npm run check:observations -- evidence/observations/${{ matrix.user }} || true
      - name: Probe the shop (cases from test-types.md)
        run: npm run probe -- --user ${{ matrix.user }} --runs ${{ github.event.inputs.runs || 10 }} --out evidence/probes/${{ matrix.user }}
      - name: Check probes against the standards
        run: npm run check:probes -- evidence/probes/${{ matrix.user }} || true
      - name: Check that every problem is in the findings register
        id: register
        shell: bash
        run: npm run check:register | tee evidence/register-report.txt
      - name: Report findings
        if: always()
        run: |
          echo "### ${{ matrix.user }}" >> "$GITHUB_STEP_SUMMARY"
          cat evidence/check-report.md evidence/probe-report.md >> "$GITHUB_STEP_SUMMARY"
          { echo '### Findings register'; echo '```'; cat evidence/register-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observations-${{ matrix.user }}
          path: evidence/
